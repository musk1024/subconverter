name: Linux release
on:
  push:
    branches: [master, surge6]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: subconverter_linux64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: subconverter_aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build static Linux package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile.release
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=release
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}
      - name: Test Surge 6 and Surge 5 compatibility
        run: |
          docker run -d --name converter --add-host=host.docker.internal:host-gateway -p 127.0.0.1:25500:25500 -v "$PWD/release/subconverter:/base" -w /base alpine:3.20 ./subconverter
          trap 'docker logs converter; docker rm -f converter' EXIT
          python3 scripts/test_surge6.py
          python3 scripts/test_https.py
      - name: Package
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          tar -C release -czf "$ARTIFACT.tar.gz" subconverter
          sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux_build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: subconverter_*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          make_latest: false
          generate_release_notes: true
